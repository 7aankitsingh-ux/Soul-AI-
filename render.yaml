services:
  - type: web
    name: soul-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SOUL_LLM_API
        fromService:
          name: soul-llm-api
          type: web

  - type: web
    name: soul-llm-api
    runtime: python
    plan: free
    rootDir: soul-llm
    buildCommand: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"